name: ci

# Docs-only changes skip the build; the installer comes from release.yml.
on:
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Runners vary; build the same portable AVX2 code the release ships.
  GGML_NATIVE: "OFF"

jobs:
  check:
    runs-on: windows-latest
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v7.0.1
      # whisper.cpp's Vulkan build nests MSBuild paths deep enough to pass MAX_PATH under the
      # default target dir. rust-cache below points at the same folder.
      - name: Short cargo target dir
        shell: pwsh
        run: '"CARGO_TARGET_DIR=$([IO.Path]::GetFullPath("$env:GITHUB_WORKSPACE\..\t"))" >> $env:GITHUB_ENV'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      # glslc compiles whisper.cpp's Vulkan shaders. bindgen uses the runner's preinstalled LLVM.
      - uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          vulkan_version: 1.4.363.0
          cache: true
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: ". -> ../t"
      - run: cargo fmt --all --check
      - name: cargo clippy (the GPU build that ships)
        run: cargo clippy --workspace --all-targets --features chidori/gpu-vulkan -- -D warnings
      - name: cargo test
        # CPU build: the runner has no GPU driver.
        run: cargo test --workspace

  macos:
    # Apple Silicon. The repo is public, so these minutes are free.
    runs-on: macos-latest
    env:
      # .cargo/config.toml's [env] carries MSVC flags for whisper.cpp; these win over it.
      CMAKE_C_FLAGS_RELEASE: "-O3 -DNDEBUG"
      CMAKE_CXX_FLAGS_RELEASE: "-O3 -DNDEBUG"
      CMAKE_C_FLAGS_RELWITHDEBINFO: "-O2 -g -DNDEBUG"
      CMAKE_CXX_FLAGS_RELWITHDEBINFO: "-O2 -g -DNDEBUG"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo clippy (the Metal build that ships)
        run: cargo clippy --workspace --all-targets --features chidori/gpu-metal -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  linux:
    # Not a release platform: Linux builds so that the app can be tested, and driven, on CI and in
    # cloud sessions (docs/DECISIONS.md → Linux). Recording runs from sound files there.
    runs-on: ubuntu-24.04
    env:
      CMAKE_C_FLAGS_RELEASE: "-O3 -DNDEBUG"
      CMAKE_CXX_FLAGS_RELEASE: "-O3 -DNDEBUG"
      CMAKE_C_FLAGS_RELWITHDEBINFO: "-O2 -g -DNDEBUG"
      CMAKE_CXX_FLAGS_RELWITHDEBINFO: "-O2 -g -DNDEBUG"
      # Debug info for the whole GPUI tree passes the runner's disk.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: System libraries (scripts/linux-env.sh lists them)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang pkg-config libasound2-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo clippy (with the drive harness, which Linux exists for)
        run: cargo clippy --workspace --all-targets --features chidori/drive -- -D warnings
      - name: cargo test
        run: cargo test --workspace
