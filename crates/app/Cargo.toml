[package]
name = "chidori"
description = "Live transcription with local Whisper"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = []
# Release builds enable Vulkan for Whisper; local builds without the Vulkan SDK stay CPU-only.
gpu-vulkan = ["chidori-core/gpu-vulkan"]
# Local NVIDIA builds only (needs the CUDA toolkit).
gpu-cuda = ["chidori-core/gpu-cuda"]
# The Mac build: Whisper on the Apple GPU.
gpu-metal = ["chidori-core/gpu-metal"]
# Test builds only: the app takes its input from a command file and draws its window to PNG
# (docs/DRIVE.md). Never in a release.
drive = ["dep:gpui-pre-platform", "dep:x11rb"]

[dependencies]
chidori-core = { path = "../core" }

# The UI is GPUI (Zed's), through GPUI Kit, which pins a GPUI snapshot and adds the text inputs
# and tooltips GPUI leaves to apps. Drift-prone: pinned with `=`.
gpui-kit = "=0.9.0"
# Only for `drive`: its test-support lets a window draw itself to an image. (Through GPUI Kit's own
# test-support feature the lockfile would have to resolve its optional second GPUI.)
gpui-pre-platform = { version = "=0.3.11", optional = true, features = ["test-support"] }
# Strokes with round caps and joins for the session's line; the version GPUI tessellates with.
lyon_tessellation = "1.0.23"
futures = "0.3.31"
# The tray icon and native popup menus (muda, re-exported), and global hotkeys.
tray-icon = "=0.26.1"
global-hotkey = "=0.9.0"
rfd = "=0.17.2"
arboard = { version = "3.7.0", default-features = false }
open = "5.4.5"
raw-window-handle = "0.6.2"
# Plays a finished session's sound (FR-09).
cpal = "=0.18.2"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "local-time"] }
tracing-appender = "0.2.5"
parking_lot = "0.12.5"
chrono = "0.4.45"
tokio = { version = "1.53.1", features = ["sync"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
base64 = "0.23.1"
unicode-normalization = "0.1.25"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "=0.8.1"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls",
  "Win32_System_Threading",
  "Win32_Security",
] }

# The window's own NSWindow calls (capture exclusion, hide to the menu bar, always on top);
# the versions GPUI and muda already use.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSApplication",
  "NSGraphics",
  "NSResponder",
  "NSRunningApplication",
  "NSView",
  "NSWindow",
] }

# Only for `drive`'s screenshots on Linux, where GPUI has no `render_to_image`: the X11 client
# GPUI's Linux backend already uses.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", optional = true }

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
tempfile = "3.27.0"
